[project]
name = "agent-observe"
version = "0.1.0"
description = "Read-only OMP session observation skill"
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_observe"]

[tool.omp.skill]
import = "agent_observe"
